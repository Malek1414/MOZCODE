name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # node:sqlite (db_schema and its tests) needs Node 22.12+.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      # dist/ and grammars/ are committed and are what users run. The black-box
      # tests exercise them, so fail if they are stale relative to src/.
      - name: Check the committed bundle is up to date
        run: |
          npm run build
          git diff --exit-code -- dist grammars || {
            echo "::error::dist/ or grammars/ is stale. Run 'npm run build' and commit the result."
            exit 1
          }
      - run: npm test
      - run: npm run verify:bundle
