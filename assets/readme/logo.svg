<svg xmlns="http://www.w3.org/2000/svg" width="304" height="224" viewBox="0 0 304 224" shape-rendering="crispEdges" role="img" aria-label="MOZCODE: a pixel mosquito with flapping wings dipping its proboscis into a pair of code braces for one small sip">
<style>
  :root { --body: #0b8a96; --stripe: #06535b; --wing: #7cc8cf; --eye: #1f2328; --leg: #4a5866; --brace: #b8730a; }
  .on-dark { display: none; }
  @media (prefers-color-scheme: dark) { :root { --body: #3fd6e0; --stripe: #1c8c99; --wing: #cdf6f9; --eye: #0d1117; --leg: #9fb6c4; --brace: #ffcf5c; } .on-dark { display: inline; } .on-light { display: none; } }
  .aura { transform-box: fill-box; transform-origin: center; animation: breathe 4.2s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: .55; transform: scale(.94); } 50% { opacity: 1; transform: scale(1.06); } }
  .spark { opacity: 0; transform-box: fill-box; transform-origin: center; animation: twinkle 3.6s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.2) rotate(0deg); } 45% { opacity: 1; transform: scale(1) rotate(45deg); } 60% { opacity: .9; } }
  .c-body { fill: var(--body); } .c-stripe { fill: var(--stripe); } .c-wing { fill: var(--wing); } .c-eye { fill: var(--eye); } .c-leg { fill: var(--leg); } .c-brace { fill: var(--brace); }
  .px { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop-in .5s cubic-bezier(.2,.9,.3,1.4) both; }
  @keyframes pop { 0% { opacity: 0; transform: scale(0); } 5% { opacity: 1; transform: scale(1); } 92% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes pop-in { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
  .bob { animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3.2px); } }
  .g-wing { transform-box: fill-box; transform-origin: 7% 100%; animation: m-wing .7s ease-in-out infinite; }
  @keyframes m-wing { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-16deg); } }
  .g-head { transform-box: fill-box; transform-origin: center; animation: m-head 2.4s ease-in-out 1.4s infinite; }
  @keyframes m-head { 0%, 54%, 66%, 78%, 100% { transform: translateY(0); } 60%, 72% { transform: translateY(8px); } }
  .g-symbol { transform-box: fill-box; transform-origin: center; animation: m-symbol 2.4s ease-in-out infinite; }
  @keyframes m-symbol { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
  @media (prefers-reduced-motion: reduce) { .px { animation: none; opacity: 1; transform: none; } .bob, .aura, .spark, .g-wing, .g-head, .g-symbol { animation: none; } }
</style>
